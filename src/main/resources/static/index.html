<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Finance Tracker</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
  input, button { padding: 8px; margin: 4px; }
  button { cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  th { background: #f0f0f0; }
  #message { color: green; margin: 10px 0; }
</style>
</head>
<body>

<h1>Finance Tracker</h1>

<div id="auth-section">
  <h2>Вход / Регистрация</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <input type="email" id="email" placeholder="Email (только для регистрации)">
  <br>
  <button onclick="login()">Войти</button>
  <button onclick="register()">Зарегистрироваться</button>
</div>

<div id="app-section" style="display:none">
  <h2>Добавить транзакцию</h2>
  <input type="number" id="amount" placeholder="Сумма">
  <input type="text" id="description" placeholder="Описание">
  <input type="datetime-local" id="date">
  <button onclick="addTransaction()">Добавить</button>

  <div id="message"></div>

  <h2>Мои транзакции</h2>
  <button onclick="loadTransactions()">Обновить</button>
  <table>
    <thead><tr><th>Сумма</th><th>Описание</th><th>Дата</th><th>Удалить</th></tr></thead>
    <tbody id="transactions-list"></tbody>
  </table>
</div>

<script>
  const API = 'http://localhost:8081';
  let token = '';
  let userId = localStorage.getItem('userId');

  async function register() {
    const res = await fetch(`${API}/api/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    alert(res.ok ? 'Зарегистрирован! Теперь войдите.' : 'Ошибка регистрации');
  }

  async function login() {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    if (res.ok) {
      token = await res.text();
      document.getElementById('auth-section').style.display = 'none';
      document.getElementById('app-section').style.display = 'block';
      loadTransactions();
    } else {
      alert('Неверный логин или пароль');
    }
  }

  async function addTransaction() {
    const res = await fetch(`${API}/api/transactions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({
        amount: document.getElementById('amount').value,
        description: document.getElementById('description').value,
        createdAt: document.getElementById('date').value
      })
    });
    if (res.ok) {
      document.getElementById('message').textContent = 'Добавлено!';
      loadTransactions();
    }
  }

  async function loadTransactions() {
    if (!userId) return;
    const res = await fetch(`${API}/api/transactions/user/${userId}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById('transactions-list').innerHTML = data.map(tx => `
      <tr>
        <td>${tx.amount} ₽</td>
        <td>${tx.description || '—'}</td>
        <td>${tx.createdAt || '—'}</td>
        <td><button onclick="deleteTransaction(${tx.id})">Удалить</button></td>
      </tr>
    `).join('');
  }

  async function deleteTransaction(id) {
    await fetch(`${API}/api/transactions/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    loadTransactions();
  }
</script>
</body>
</html>
